<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoomp — prototyper</title>
<style>
  :root {
    --paper: #f0ece2;
    --ink: #1a1a17;
    --edge: rgba(26, 26, 23, 0.22);
    --dim: rgba(26, 26, 23, 0.62);
    --bg: #c9c4b8;
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px;
    background: var(--bg);
    font: 11px/1.5 Menlo, Monaco, "DejaVu Sans Mono", "Courier New", monospace;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .rig { width: min(1280px, 100%); display: flex; flex-direction: column; gap: 12px; }

  /* The faceplate is exactly what the plug-in draws. Everything web-only
     lives in the strip below it. */
  #panel {
    width: 100%;
    aspect-ratio: 1280 / 1000;
    display: block;
    background: var(--paper);
    touch-action: none;
    cursor: crosshair;
  }

  .strip {
    background: var(--paper);
    border: 1px solid var(--edge);
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
  }

  .group { display: flex; align-items: center; gap: 7px; }
  .rule { width: 1px; align-self: stretch; background: var(--edge); }

  label, .cap {
    font-size: 8px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
  }

  button {
    font: inherit;
    font-size: 8px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--paper);
    border: 1.2px solid rgba(79, 126, 168, 0.55);
    padding: 4px 9px;
    cursor: pointer;
  }
  button:hover { border-color: #4f7ea8; }
  button:active { background: #4f7ea8; color: var(--paper); }

  #hit {
    border-color: rgba(237, 129, 89, 0.75);
    padding: 6px 20px;
    font-size: 9px;
  }
  #hit:active { background: #ed8159; }

  #auto[aria-pressed="true"] {
    background: #4f7ea8;
    border-color: #4f7ea8;
    color: var(--paper);
  }

  .step { padding: 3px 7px; }

  .value { font-size: 11px; min-width: 3.6em; text-align: center; }
  #note { font-size: 13px; min-width: 2.6em; text-align: center; }

  input[type=range] { width: 96px; accent-color: #4f7ea8; }

  #scope { width: 100%; height: 76px; display: block; }

  .footer {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    font-size: 9px;
    color: var(--dim);
  }
  #status { color: var(--ink); }
</style>
</head>
<body>

<div class="rig">
  <canvas id="panel" width="1280" height="1000"></canvas>

  <div class="strip">
    <button id="hit">Hit</button>
    <button id="auto" aria-pressed="true">Auto on</button>

    <div class="group">
      <span class="cap">Note</span>
      <button class="step" id="notedown">&minus;</button>
      <span id="note">C1</span>
      <button class="step" id="noteup">+</button>
    </div>

    <div class="rule"></div>

    <div class="group">
      <label for="vel">Vel</label>
      <input type="range" id="vel" min="1" max="127" value="127">
      <span class="value" id="velout">127</span>
    </div>

    <div class="group">
      <label for="gate">Gate</label>
      <input type="range" id="gate" min="5" max="1000" step="5" value="100">
      <span class="value" id="gateout">100 ms</span>
    </div>

    <div class="rule"></div>

    <div class="group">
      <button id="cpp">Copy C++</button>
      <button id="json">Copy JSON</button>
      <button id="wav">Save WAV</button>
      <button id="reset">Defaults</button>
    </div>

    <div class="rule"></div>

    <div class="group">
      <span class="cap">MIDI</span>
      <span id="midi">…</span>
    </div>
  </div>

  <canvas id="scope"></canvas>

  <div class="footer">
    <span id="status"></span>
    <span>z s x d c v g b h n j m — chromatic from C1</span>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
